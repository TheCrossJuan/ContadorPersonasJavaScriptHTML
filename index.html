<!DOCTYPE html>
<html>
	<head>
		<link rel="stylesheet" href="fomat.css">
		<link rel="icon" href="icon.png" type="image/png">
		<title>Cuenta Personas</title>
	<head>
	<body>
		<div id="titulo">
			<h1> Contador de Personas </h1>
		</div>
		<div>
			<img src="hombre.png" width="100px" style="margin-left: 200px;">	
			<form align="left" onsubmit="return false;">
				<input type="text" id="contadorH" value="0">
				<table>
					<th>
						<button id="boton" type="button" onclick="restarH()">-1</button>
					
					</th>
					<th>
						<button id="boton2" type="button" onclick="sumarH()">+1</button>
					</th>
				</table>
				<button id="boton" type="button" onclick="resetH()">Reset</button>
			</form>
		</div>	
		<div align="right" id="mujeh">
			<img src="mujeh.png" width="100px" style="margin-right: 200px;">
			<form onsubmit="return false;">
				<input type="text" id="contadorM" value="0">
				<table>
					<th>
						<button id="boton3" type="button" onclick="restarM()">-1</button>
					
					</th>
					<th>
						<button id="boton4" type="button" onclick="sumarM()">+1</button>
					</th>
				</table>
				<button id="boton4" type="button" onclick="resetM()">Reset</button>
			</form>
			<form id="general">
				<input id="contadorG" type="text" value="0" readonly>
			</form>	
		</div>
	</body>
	<script>
		
		function dispararEfectoBoteH() {
			var inputContador = document.getElementById("contadorH");
			// Quitamos la clase por si ya la tiene, para reiniciar la animación
			inputContador.classList.remove("animar-bote");
			// Forzamos un reflow del navegador para que reconozca el reinicio
			void inputContador.offsetWidth;
			// Añadimos la clase de la animación
			inputContador.classList.add("animar-bote");
		}
		
		function sumarH(){
			var contador = parseInt(document.getElementById("contadorH").value);
			if(document.getElementById("contadorG").value >= 100){
				window.alert("No pueden haber mas de 100 personas...");
				document.getElementById("contadorG").value = 100;
			}
			else{
				contador++;
				document.getElementById("contadorH").value = contador;
				dispararEfectoBoteH();
				sumarG();
			}		
			noNulo();
		}
		
		function restarH(){
			var contador = parseInt(document.getElementById("contadorH").value);
			contador--;
			if(contador<0){
				window.alert("No pueden haber Hombres negativos...");
				contador = 0;
			}
			document.getElementById("contadorH").value = contador;
			dispararEfectoBoteH();
			if(document.getElementById("contadorH").value > 100){
				document.getElementById("contadorH").value = 0;
			}
			sumarG();
			noNulo();
		}
		
		function resetH(){
			document.getElementById("contadorH").value = 0;
			sumarG();
		}
		
		function dispararEfectoBoteM() {
			var inputContador = document.getElementById("contadorM");
			// Quitamos la clase por si ya la tiene, para reiniciar la animación
			inputContador.classList.remove("animar-bote");
			// Forzamos un reflow del navegador para que reconozca el reinicio
			void inputContador.offsetWidth;
			// Añadimos la clase de la animación
			inputContador.classList.add("animar-bote");
		}
		
		function sumarM(){
			var contador = parseInt(document.getElementById("contadorM").value);
			if(document.getElementById("contadorG").value == 100){
				window.alert("No pueden haber mas de 100 personas...");
				document.getElementById("contadorG").value = 100;
			}
			else{
				contador++;
				document.getElementById("contadorM").value = contador;
				dispararEfectoBoteM();
				sumarG();
			}
			noNulo();
		}
		
		function restarM(){
			var contador = parseInt(document.getElementById("contadorM").value);
			contador--;
			if(contador<0){
				window.alert("No pueden haber Mujeres negativas...");
				contador = 0;
			}
			document.getElementById("contadorM").value = contador;
			if(document.getElementById("contadorM").value > 100){
				document.getElementById("contadorM").value = 0;
			}
			dispararEfectoBoteM();
			sumarG();
			noNulo();
		}
		
		function resetM(){
			document.getElementById("contadorM").value = 0;
			sumarG();
		}
		
		function noNulo(){
			if(document.getElementById("contadorH").value == "NaN"){
				document.getElementById("contadorH").value = 0;
				document.getElementById("contadorG").value = document.getElementById("contadorM").value;
			}	
			if(document.getElementById("contadorM").value == "NaN"){
				document.getElementById("contadorM").value = 0;
				document.getElementById("contadorG").value = document.getElementById("contadorH").value;
			}
		}
		
		function dispararEfectoBoteG() {
			var inputContador = document.getElementById("contadorG");
			// Quitamos la clase por si ya la tiene, para reiniciar la animación
			inputContador.classList.remove("animar-bote");
			// Forzamos un reflow del navegador para que reconozca el reinicio
			void inputContador.offsetWidth;
			// Añadimos la clase de la animación
			inputContador.classList.add("animar-bote");
		}
		
		function sumarG(){
			var num1 = parseInt(document.getElementById("contadorM").value);
			var num2 = parseInt(document.getElementById("contadorH").value);
			document.getElementById("contadorG").value = num1 + num2;
			dispararEfectoBoteG();
		}
		
	</script>
</html>
